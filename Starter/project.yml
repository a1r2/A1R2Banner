name: A1R2BannerStarter
options:
  bundleIdPrefix: com.a1r2
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
packages:
  A1R2Banner:
    # The SDK lives one level up (this Starter is inside the package repo).
    path: ..
targets:
  A1R2BannerStarter:
    type: application
    supportedDestinations: [iOS, tvOS]
    sources: [A1R2BannerStarter]
    dependencies:
      - package: A1R2Banner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.a1r2.A1R2BannerStarter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2,3"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
